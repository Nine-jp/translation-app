<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語⇄スペイン語 リアルタイム翻訳</title>
    <meta name="description" content="日本語とメキシコスペイン語間のリアルタイム音声・テキスト翻訳。PWA対応でオフラインでも利用可能。">
    <meta name="theme-color" content="#4A90E2"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-xl shadow-2xl p-6 md:p-8 w-full max-w-2xl transform transition-all duration-300 hover:scale-[1.01]">
        <h1 class="text-3xl md:text-4xl font-extrabold text-center text-gray-800 mb-6">
            <span class="text-blue-600">日本語</span> ⇄ <span class="text-green-600">スペイン語</span> 翻訳
        </h1>

        <!-- 言語選択ドロップダウン -->
        <div class="flex flex-col md:flex-row justify-center items-center gap-4 mb-6">
            <div class="flex items-center space-x-2">
                <label for="inputLanguage" class="text-gray-700 font-medium">入力言語:</label>
                <select id="inputLanguage" class="p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 transition-all duration-200">
                    <option value="ja-JP">日本語</option>
                    <option value="es-MX">メキシコスペイン語</option>
                </select>
            </div>
            <button id="swapLanguagesBtn" class="p-2 bg-gray-200 rounded-full hover:bg-gray-300 transition-all duration-200" aria-label="言語を入れ替える">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                </svg>
            </button>
            <div class="flex items-center space-x-2">
                <label for="outputLanguage" class="text-gray-700 font-medium">出力言語:</label>
                <select id="outputLanguage" class="p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 transition-all duration-200">
                    <option value="es-MX">メキシコスペイン語</option>
                    <option value="ja-JP">日本語</option>
                </select>
            </div>
        </div>

        <!-- 入力エリア -->
        <div class="mb-6">
            <textarea id="inputText" placeholder="翻訳したいテキストを入力するか、マイクボタンを押して話してください..."
                      class="w-full p-4 border border-gray-300 rounded-lg shadow-inner focus:outline-none focus:ring-2 focus:ring-blue-300 transition-all duration-200 resize-y min-h-[100px] text-gray-800"></textarea>
        </div>

        <!-- アクションボタン -->
        <div class="flex flex-col md:flex-row justify-center gap-4 mb-6">
            <button id="voiceInputBtn" class="flex-1 bg-green-500 text-white py-3 px-6 rounded-lg shadow-md hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-opacity-75 transition-all duration-200 flex items-center justify-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M7 4a3 3 0 016 0v6a3 3 0 11-6 0V4z" />
                    <path fill-rule="evenodd" d="M4 4a1 1 0 011 1v5a5 5 0 11-2 0V5a1 1 0 011-1zM13 4a1 1 0 011 1v5a5 5 0 11-2 0V5a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                <span>音声入力</span>
            </button>
            <button id="translateBtn" class="flex-1 bg-blue-500 text-white py-3 px-6 rounded-lg shadow-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-opacity-75 transition-all duration-200 flex items-center justify-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 0l-3 3a1 1 0 001.414 1.414L9 9.414V13a1 1 0 102 0V9.414l1.293 1.293a1 1 0 001.414-1.414z" clip-rule="evenodd" />
                </svg>
                <span>翻訳する</span>
            </button>
            <button id="clearBtn" class="flex-1 bg-red-500 text-white py-3 px-6 rounded-lg shadow-md hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-opacity-75 transition-all duration-200 flex items-center justify-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm6 0a1 1 0 11-2 0v6a1 1 0 112 0V8z" clip-rule="evenodd" />
                </svg>
                <span>クリア</span>
            </button>
        </div>

        <!-- 翻訳結果エリア -->
        <div class="relative bg-gray-50 p-4 rounded-lg shadow-inner min-h-[100px] flex items-center justify-center text-gray-700 text-lg">
            <p id="translatedText" class="text-center"></p>
            <!-- ローディングインジケーター -->
            <div id="loadingIndicator" class="absolute inset-0 bg-white bg-opacity-75 flex items-center justify-center hidden">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
            </div>
        </div>

        <!-- 読み上げボタン -->
        <div class="mt-4 flex justify-center">
            <button id="speakTranslatedTextBtn" class="bg-purple-500 text-white py-3 px-6 rounded-lg shadow-md hover:bg-purple-600 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:ring-opacity-75 transition-all duration-200 flex items-center justify-center space-x-2 disabled:bg-gray-400" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10 2a1 1 0 00-1.316.924l-1.07 3.292a1 1 0 00.364 1.118l2.927 2.148a1 1 0 001.176 0l2.927-2.148a1 1 0 00.364-1.118l-1.07-3.292A1 1 0 0010 2zm0 14a1 1 0 00.95-.69l1.07-3.292a1 1 0 00-.364-1.118L8.73 9.073a1 1 0 00-1.176 0l-2.927 2.148a1 1 0 00-.364 1.118l1.07 3.292A1 1 0 006 16h8z" />
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm-6.854-5.793a1 1 0 00-1.118.364l-1.07 3.292a1 1 0 00.95.69h14.184a1 1 0 00.95-.69l-1.07-3.292a1 1 0 00-1.118-.364l-2.927 2.148a1 1 0 01-1.176 0l-2.927-2.148a1 1 0 00-1.176 0l-2.927 2.148zM4.927 8.73l-1.07-3.292a1 1 0 01.95-.69h10.384a1 1 0 01.95.69l-1.07 3.292a1 1 0 01-1.118.364L8.73 6.927a1 1 0 00-1.176 0L4.927 8.73z" clip-rule="evenodd" />
                </svg>
                <span>翻訳結果を読み上げる</span>
            </button>
        </div>

        <!-- カスタムメッセージボックス -->
        <div id="messageBox" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
            <div class="bg-white p-6 rounded-lg shadow-xl text-center max-w-sm w-full">
                <p id="messageText" class="text-gray-800 text-lg mb-4"></p>
                <button id="messageBoxClose" class="bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400">閉じる</button>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
